<!DOCTYPE html>
<!--Es importante colocar ng-app para el soporte de anotaciones de angular-->
<html ng-app>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Mundo con AngularJS</title>
    <!--Se referencia a AngularJS-->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.32/angular.min.js"></script>
</head>
<body>
    <!--Cuando se referencia a AngularJS entonces dentro de las {{ Soporta operaciones JS }}-->
    {{"Hola" + " Mundo" + " en AngularJS"}}
</body>
</html>
