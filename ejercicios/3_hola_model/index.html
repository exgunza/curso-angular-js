<!DOCTYPE html>
<html lang="es" ng-app="MyFirstApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola Model</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.32/angular.min.js"></script>
    <script src="controller.js"></script>
</head>
<body ng-controller="FirstController">
    <!--
    ng-model
    - Permite manejar del DataBinding
    - Sincroniza el valor del control con el de la variable "nombre"
    -->
    <h3>Registro de comentarios</h3>
    <input type="text" ng-model="nuevoComentario.username">
    <br/>
    <input type="text" ng-model="nuevoComentario.comentario">
    <br/>
    <button ng-click="agregarComentario()">Agregar comentario</button>
    <h3>Comentarios</h3>
    <ul>
        <li ng-repeat="comment in comentarios">
            {{comment.comentario}} - <strong>{{comment.username}}</strong>
        </li>
    </ul>
</body>
</html>
